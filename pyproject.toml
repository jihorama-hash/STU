[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roundabout-safety"
version = "0.1.0"
description = "Reproducible drone-video traffic conflict analysis and offline demo"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analysis = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
]
detection = [
  "ultralytics>=8.3,<9",
  "supervision<0.30", # ByteTrack was removed in supervision 0.30.
]
dev = ["pytest>=8,<9"]
demo = ["streamlit>=1.37,<2"]

[project.scripts]
roundabout-inventory = "roundabout.inventory:main"
roundabout-batch = "roundabout.run_batch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
