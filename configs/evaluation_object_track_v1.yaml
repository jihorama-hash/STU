  mt_pt_ml_thresholds:
    grade: C
    source: 2026-11-03 user decision 2; MOT16 definition, https://arxiv.org/abs/1603.00831
  coverage_status_thresholds:
    grade: C
    source: 2026-11-03 user-approved TASK-006 operating rule E
