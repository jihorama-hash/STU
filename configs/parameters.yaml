# ---------------------------------------------------------------------------
# 무신호 횡단보도 안전성 진단 — 파라미터 레지스트리 v0.2.3
# 작성일 2026-08-10
# 상위 문서 : 무신호횡단보도_지표정의서_v03.md + _v04_CEI개정분.md
# 구현 문서 : 무신호횡단보도_구현사양서_v01.md + _v02_CEI개정분.md
#
# 규칙
#   1. 모든 상수는 이 파일에만 존재한다. 코드에 하드코딩 금지.
#   2. 각 값에 evidence(근거등급 A/B/C)와 source 를 붙인다.
#   3. 값을 바꾸면 version 을 올리고 changelog 에 사유를 적는다.
#   4. sensitivity 목록이 있는 값은 민감도 분석 대상이다. baseline 만 쓰고 끝내면 안 된다.
#   5. 결과가 좋아지는 방향으로 값을 조정하지 않는다.
#
# 근거등급  A: 문헌에 수치 명시 / B: 문헌 관행값, 출처마다 상이
#           C: 본 과제 잠정값, 민감도 분석으로 확정 필요
# ---------------------------------------------------------------------------

meta:
  version: "0.2.3"
  spec_version: "v0.4"
  created: "2026-08-10"
  changelog:
    - version: "0.1"
      date: "2026-08-09"
      note: "최초 작성. 지표정의서 v0.3 전환에 맞춰 상호작용·DPD 계열 신설"
    - version: "0.2"
      date: "2026-08-10"
      note: >
        지점당 조우 93건 확보 불가 확정 → 3지점 상대비교 주지표를 CEI 로 전환.
        cei 블록 신설, ranking 블록 신설, validation.gate_requirements 신설
        (게이트를 지표군별로 분리), reporting.final_output_set 교체.
        기존 블록은 전부 유지 — 보조 지표로 계속 산출한다.
    - version: "0.2.1"
      date: "2026-08-13"
      note: >
        YAML 파싱 오류 수정. ssm_auxiliary.rttc_conflict_s 행이
        "rttc_conflict_s:{value: ...}" 로 콜론 뒤 공백이 빠져 있어
        플로우 매핑 구문 오류로 파일 전체가 yaml.safe_load 에 실패했다.
        콜론 뒤 공백을 추가해 다른 행과 표기를 맞췄다. 값 변경 없음.
    - version: "0.2.1"
      date: "2026-08-13"
      note: >
        v0.1→v0.2 전환 시 기록 없이 누락된 근거 주석 복원. 삭제된 채였던
        grouping.sm_reference.source, ssm_auxiliary.pet_conflict_s.source,
        ssm_auxiliary.pet_severe_s.source 를 되살렸고, registration.residual_tol_m.source,
        smoothing.window_s.source, validation.stage1_gate.position_rmse_tol_m.source,
        sampling.pdi_min_survey_days.source, compliance.tau_stop_s.note 는 v0.1 문장을
        v0.2 문장 뒤에 이어 붙여 병합했다. 값 변경 없음.
    - version: "0.2.1"
      date: "2026-08-13"
      note: "06번 지시문 §3.3 반영. encounter_ambiguity 블록 신설."
    - version: "0.2.1"
      date: "2026-08-13"
      note: >
        페이즈 1-2(고정 기준점 후보 제시) 재개. registration.reference_point_detection
        블록 신설(grid_rows/grid_cols/candidates_to_present/excluded_surfaces).
        코너 검출기 튜닝값(max_corners·quality_level·min_distance_px·block_size·
        vegetation_hsv)과 마스킹 창 폭은 후보 생성 전용이며 최종 결과에 영향을 주지
        않는다는 판단(사용자 승인이 최종 채택 게이트) 하에 YAML에 올리지 않고
        src/39_register_frames.py 상단 CANDIDATE GENERATION TUNING 블록에 남긴다 —
        규칙 1의 명시적 예외.
    - version: "0.2.2"
      date: "2026-08-14"
      note: >
        페이즈 1-3(프레임별 기준점 추적·similarity 변환 추정) 착수.
        registration.point_tracking 블록 신설(search_radius_px/template_radius_px/
        ransac_reproj_threshold_px/min_inliers_per_frame). 1-2 후보생성 튜닝값과
        달리 이 값들은 최종 정합 정확도에 직접 영향을 주므로 스크립트 주석이 아니라
        YAML에 등재한다. 전부 evidence C — pending에 민감도 분석 대상으로 등재.
        registration.reference_points_min 의 note에 point_tracking.min_inliers_per_frame
        과의 정적/동적 구분을 명시(값 변경 없음).
    - version: "0.2.3"
      date: "2026-08-14"
      note: >
        1-3 실행(DJI_0481·DJI_0482) 결과 점2·12·13이 매칭 불안정, 점5·6·14가
        노면 위 구조물(육안 확인)로 밝혀져 6점(2·5·6·12·13·14)을 기준점에서
        제외 확정. 유지 5점(1·7·8·9·11)만으로는 min_inliers_per_frame=6을
        채울 수 없어 1-2를 재개(빈 그리드 칸 재검출 + 승인 전 자동 검증).
        registration.reference_point_validation 블록 신설 —
        test_window_frames(클립 앞·중·뒤 3구간×100프레임), min_inliers_for_base_fit=4
        (유지 5점 중 4/5 합의로 완화 — 5점 전체로 6 인라이어 요구는 애초에 불가능),
        ncc_mean_min/residual_mean_max_px/residual_p95_max_px,
        direction_radial_angle_max_deg(플래그 전용, 자동 제외 아님). 전부 evidence C.
        residual_p95_max_px는 잠정값이라 향후 조정 시 반드시 이 changelog에
        사유를 남길 것(규칙 5).

# ===========================================================================
# 0. 지표 위계 (v0.2 신설) — 무엇을 서열 판정 근거로 쓰는가
# ===========================================================================
indicator_hierarchy:
  primary:      [cei, suppression_panel]      # 3지점 서열 판정의 근거
  secondary:    [interaction_profile, compliance, exposure]
  reference_only: [p_pdi, dpd_distribution, ssm_auxiliary]
  note: >
    버리는 지표는 없다. 전부 산출하되 서열 판정의 근거로 쓰는 것만 primary 다.
    reference_only 는 값의 절대 해석을 금지한다.

# ===========================================================================
# 1. 좌표·전처리   (v0.1 에서 변경 없음)
# ===========================================================================
site:
  hover_group_count: 1
  shared_scale: true
  note: >
    8클립 전부 동일 호버링 위치(2026-08-09 확인). 캘리브레이션은 단순해지지만
    호버 표류 보정이 필수가 된다. registration 블록 참조.

registration:                 # V-A2 — 영상 정합
  enabled: true
  required_before_all: true
  reference_points_min:
    value: 6
    evidence: C
    note: >
      노면 고정 특징점만. 차량·보행자·그림자 금지. 화면에 고르게 분포.
      이 값은 1-2 승인 시 확보해야 할 기준점 총수(정적) — 사용자 승인 절차의
      하한이며 프레임마다 다시 평가되지 않는다. registration.point_tracking.
      min_inliers_per_frame(프레임별 RANSAC 인라이어 최소치, 동적)과는 다른
      값이다. cei.t_r 과 encounter.perception_reaction_s 를 값이 같은 개념이라도
      적용 단계가 다르면 구분해 쓰는 것과 같은 취지 — 우연히 시작값이 같다고
      하나로 합치지 않는다.
  transform_model: similarity
  residual_tol_m:
    value: 0.05
    unit: m
    evidence: C
    source: >
      V-B 게이트(0.10 m)의 절반. 4K/가로60m 기준 GSD 0.0156 m/px 에서
      0.10 m = 6.4 px, 1 m 표류 = 64 px 이므로 정합 없이는 게이트 통과 불가.
      정합 오차가 궤적 오차 예산의 절반을 넘으면 안 된다.
  report_before_after: true
  reference_point_detection:            # 1-2 — 고정 기준점 후보 제시(사용자 승인 전 단계)
    grid_rows:
      value: 3
      evidence: C
      note: >
        1-2 후보 제시용. 최종 기준점은 사용자 승인으로 확정되므로 민감도 분석 대상 아님.
    grid_cols:
      value: 3
      evidence: C
      note: >
        1-2 후보 제시용. 최종 기준점은 사용자 승인으로 확정되므로 민감도 분석 대상 아님.
    candidates_to_present:
      min: 8
      max: 12
      evidence: C
      note: >
        1-2 후보 제시용. 최종 기준점은 사용자 승인으로 확정되므로 민감도 분석 대상 아님.
    excluded_surfaces:
      value: [vehicle, pedestrian, vegetation, shadow]
      evidence: C
      note: >
        1-2 후보 제시용. 최종 기준점은 사용자 승인으로 확정되므로 민감도 분석 대상 아님.
        vehicle·pedestrian·vegetation은 코드가 자동 마스킹하고, shadow는 자동 검출하지
        않는다 — 번호가 매겨진 후보 이미지에서 사용자가 승인 단계에 육안으로 제외한다.

  point_tracking:                       # 1-3 — 프레임별 기준점 추적·similarity 변환 추정
    search_radius_px:
      value: 15
      unit: px
      evidence: C
      sensitivity: [10, 15, 25]         # 향후 민감도 분석 대상
      note: >
        직전 프레임 변환으로 예측한 위치 주변 탐색창 반경(클립 내 연속 프레임용).
        클립의 첫 프레임은 이 예측이 없으므로 homography 체인 초기 추정을 쓴다
        (아래 clip_first_frame_init 참고) — 이 반경은 그 초기 추정의 잔차 오차만
        흡수하면 된다.
      source: >
        승인 11점 중 최근접 점간 거리는 48.4px(2번-8번, 2026-08-14 측정,
        registration/reference_points_final.json 좌표로 계산). search_radius_px +
        template_radius_px 합이 그 절반(24.2px)을 넘으면 옆 점의 특징을 잘못
        찾을 위험이 커진다. 15+8=23px로 여유를 둔 잠정값 — 1-2 후보생성
        튜닝값과 달리 결과에 직접 영향을 주므로 여기 등재한다(스크립트 주석 아님).
    template_radius_px:
      value: 8
      unit: px
      evidence: C
      sensitivity: [6, 8, 10]
      note: "기준 프레임에서 점 주변을 잘라 템플릿으로 쓸 반경(NCC 매칭)."
      source: "search_radius_px 항목과 동일 제약(최근접 점간 거리 48.4px)에서 도출."
    ransac_reproj_threshold_px:
      value: 3
      unit: px
      evidence: C
      sensitivity: [2, 3, 5]
      note: "cv2.estimateAffinePartial2D RANSAC 인라이어 판정 기준."
      source: >
        registration.residual_tol_m(0.05m) / GSD(0.0156 m/px, registration.
        residual_tol_m.source 참고) ≈ 3.2px → 반올림. 최종 정합 오차 허용치에
        맞춰 인라이어 판정 기준을 역산했다.
    min_inliers_per_frame:
      value: 6
      evidence: C
      sensitivity: [5, 6, 8]
      note: >
        프레임별 RANSAC 인라이어 최소치(동적). 시작값은 registration.
        reference_points_min과 같은 6이지만 별도 파라미터다 — 위 reference_points_min
        의 note 참고. 미달 시 그 프레임은 FAILED로 결측 처리한다(보간 없음,
        2026-08-14 사용자 결정).
    clip_first_frame_init:
      method: homography_chain
      evidence: C
      note: >
        클립의 첫 프레임은 calib/alignment_homographies.json(각 클립 frame0 ->
        DJI_0481 frame0)에 DJI_0481 자체의 frame0->frame2848(기준 프레임) 드리프트를
        합성한 homography로 초기 위치를 추정한다. 2026-08-14 측정
        (registration/clip_first_frame_offset_diagnostic.json): 항등변환 가정 시
        어긋남이 DJI_0481조차 평균 13.4px(최대 20.7px), 나머지 클립은
        27~195px로 search_radius_px(15px)를 훨씬 초과해 전 클립에 homography
        체인을 적용한다. alignment_homographies.json 자체를 최종 변환으로
        쓰는 것이 아니라 탐색 시작 위치로만 쓰므로 27번 폐기 판단
        (MIGRATION_PLAN.md §5)과 충돌하지 않는다.

  reference_point_validation:          # 1-2 재개(2026-08-14) — 승인 전 자동 검증
    test_clips: [DJI_0481, DJI_0482]
    evidence: C
    note_test_clips: >
      기준 프레임이 속한 DJI_0481뿐 아니라 비기준 클립 DJI_0482도 반드시 포함한다.
      점2가 DJI_0481 단독으로는 통과권(잔차 1.02px)이었으나 DJI_0482에서만
      탈락(5.14px)한 사례(2026-08-14)가 근거 — 기준 클립 하나만 보면 클립 간
      재현성 불량을 놓친다.
    test_window_frames:
      evidence: C
      note: >
        클립 앞·중·뒤 3구간×100프레임(=클립당 300프레임). DJI_0482의 중간 구간은
        원인 미해결 실패 구간(frame 5402~5791, 2026-08-14 확인)을 포함하도록
        지정해 후보 검증과 그 구간의 원인 규명을 함께 간다.
      DJI_0481: {front: [100, 200], mid: [4300, 4400], end: [8500, 8600]}
      DJI_0482: {front: [100, 200], mid: [5450, 5550], end: [8500, 8600]}
    min_inliers_for_base_fit:
      value: 4
      evidence: C
      note: >
        검증 단계의 "기준 모델"은 유지 5점(1·7·8·9·11)만으로 RANSAC similarity를
        적합한다. 5점 전체를 모집단으로 놓고 point_tracking.min_inliers_per_frame
        (=6)을 그대로 쓰면 5점 중 6점 인라이어를 요구하는 셈이 되어 정의 자체가
        성립하지 않는다 — 그래서 4로 낮춘다(5점 중 4점 합의). 후보 표에는 각
        프레임이 5/5·4/5 중 어느 쪽에서 나온 값인지 구분해 표시한다.
    ncc_mean_min:
      value: 0.5
      evidence: C
      note: >
        점12(NCC 0.22~0.34)·점14(0.39~0.70) 같은 저텍스처 후보를 걸러내는
        사전 필터. 단독 결정 기준은 아니다 — 점2는 NCC 0.937(양호 점들과
        동급)인데도 기하학적으로 틀렸다(2026-08-14 확인). NCC는 "특징이
        뚜렷한가"만 보고, "맞는 자리에 있는가"는 residual_mean_max_px가 본다.
    residual_mean_max_px:
      value: 3.0
      unit: px
      evidence: C
      note: "point_tracking.ransac_reproj_threshold_px와 동일값. 승인 기준과 프로덕션 인라이어 기준을 일치시킨다. DJI_0481·DJI_0482 두 클립 모두 통과해야 승인."
    residual_p95_max_px:
      value: 6.0
      unit: px
      evidence: C
      sensitivity: [4.0, 6.0, 8.0]
      note: >
        mean 기준의 2배로 잠정 설정 — 가끔 튀는 프레임(가림 등)까지 완전히
        막으면 통과 후보가 거의 안 남을 것으로 예상되어 여유를 뒀다. 실제
        검증표를 받은 뒤 조정 가능성이 있다. 이 값을 바꿀 때는 반드시
        meta.changelog에 사유를 남길 것 — CLAUDE.md 절대 규칙 5(결과가
        좋아지는 방향으로 임계값을 조정하지 않는다, 변경 시 민감도 분석 병기).
    direction_radial_angle_max_deg:
      value: 30.0
      unit: deg
      evidence: C
      note: >
        플래그 전용이다. 자동 제외하지 않는다. 두 클립 모두에서 잔차벡터가
        화면중심 방사방향과 이 각도 이내(바깥쪽)면 "높이 의심(노면 위
        구조물일 가능성)" 플래그만 붙이고, 200x200 문맥 이미지를 함께 제시해
        사용자가 육안으로 최종 판단한다. 근거: 점5·6·14가 두 클립 모두 이
        각도 미만이었고(2026-08-14), 육안 확인 결과 실제로 노면 위 0.1~0.2m
        구조물이었다.

geometry:
  scale_error_tol:
    value: 0.03
    unit: ratio
    evidence: B
    source: "지표정의서 v0.3 §1.1. 초과 시 4점 호모그래피 전환"
  center_fraction:
    value: 0.60
    unit: ratio
    evidence: C
  stripe_period_m:
    value: 0.90
    unit: m
    evidence: A
    source: "도로교통법 시행규칙 노면표시 규격 (폭 0.45 + 간격 0.45)"

smoothing:
  method: savgol
  polyorder: 2
  window_s:
    value: 0.5
    unit: s
    evidence: C
    sensitivity: [0.3, 0.5, 1.0]     # V-E2
    source: "a5 가 이 값에 가장 민감. CEI 의 V 에도 영향. 지표정의서 v0.3 §1.2."
  min_track_frames: 5
  acceleration_basis: tangential

# ===========================================================================
# 2. 객체 클래스와 치수   (v0.1 에서 변경 없음)
#    주의: CEI 는 이 블록을 사용하지 않는다 (차폭 무관)
# ===========================================================================
classes:
  vehicle_group: [car, car_light, bus, truck, motorcycle]
  pedestrian_group: [pedestrian, bicycle, pm]

vehicle_width_m:               # W_v — S_m 전용
  evidence: C
  source: "국내 대표 제원. 실측 아님. 민감도 ±0.2 m (V-E5)"
  sensitivity_delta: 0.2
  values: {car: 1.80, car_light: 1.60, bus: 2.50, truck: 2.35,
           motorcycle: 0.80, bicycle: 0.60, pm: 0.60}

vehicle_length_m:              # L_v — 차량 전면 위치 산출용
  evidence: C
  values: {car: 4.70, car_light: 3.60, bus: 11.00, truck: 6.50,
           motorcycle: 2.10, bicycle: 1.75, pm: 1.20}

pedestrian_size_m:             # w_p
  value: 0.75
  unit: m
  evidence: B
  sensitivity: [0.40, 0.50, 0.75]    # V-E1
  source: "Neufert. 원 논문(Dąbkowski et al. 2025) 채택값 0.75×0.75"

class_finalization:
  method: confidence_weighted_majority
  flicker_ratio_max: {value: 0.20, evidence: C}
  cross_group_switch_unstable: true

pm_handling:
  mounted_speed_threshold_ms:
    value: 1.8
    unit: m/s
    evidence: C
    source: "일반 보행속도 상한 근사. 오분류율을 육안 검증에서 보고할 것"

# ===========================================================================
# 3. 공간 기준요소   (v0.2: P_v 관련 주석 추가)
# ===========================================================================
regions:
  cw_ext_margin_m: {value: 1.0, unit: m, evidence: C}
  wz_depth_m:      {value: 2.0, unit: m, evidence: C}
  approach_upstream_m: 30.0    # D30 — CEI-G 의 P_v 로 그대로 사용
  approach_mid_m: 20.0         # D20
  downstream_m: 10.0
  a5_length_m:
    value: 5.0
    unit: m
    evidence: A
    source: "원 논문 a5 정의 (상류 5 m 최대 감속도)"
  a5_min_frames: {value: 3, evidence: C}
  turn_heading_deg: {value: 30.0, evidence: C}

# ===========================================================================
# 4. 군집   (v0.1 에서 변경 없음. CEI 는 사용하지 않음)
# ===========================================================================
grouping:
  enabled: true
  run_both_modes: true
  distance_m: {value: 2.0, unit: m, evidence: C, sensitivity: [1.5, 2.0, 3.0]}
  heading_diff_deg: {value: 30.0, evidence: C}
  speed_diff_ms: {value: 0.3, unit: m/s, evidence: C}
  min_duration_s: {value: 1.0, unit: s, evidence: C}
  sm_reference: {type_A: leading, type_B: trailing, source: "claude/03_..._v01.md §6.3"}

# ===========================================================================
# 5. CEI — 반사실적 노출 지수  ★ v0.2 신설. 3지점 서열 판정의 주지표
# ===========================================================================
cei:
  enabled: true
  primary_indicator: true

  # --- 명명 규약 (2026-08-10 확정: PSD 와 CEI 를 병기한다) ----------------
  naming:
    policy: "dual"                # PSD(기성 지표) + CEI(본 과제 명칭) 병기
    report_label: "PSD<1 통과율 (CEI) [%]"
    report_label_G: "PSD<1 통과율 (CEI-G) [%]"
    report_label_S: "PSD<1 통과율 (CEI-S) [%]"
    first_mention: >
      Allen et al.(1978)의 PSD(Proportion of Stopping Distance, 정지거리비)를
      전 통과 차량으로 확장 적용한 지수 — 본 과제 명칭 CEI(Counterfactual
      Exposure Index, 반사실적 노출 지수)
    code_column: "CEI_rate_pct"   # 데이터 사전에 "= PSD<1 통과율" 병기 의무
    forbid_cei_alone: true        # 제목·요약·초록에 CEI 단독 표기 금지
    disclosure_required: true     # "CEI 는 본 과제 신조어"를 각주에 고지
    evidence_note: >
      PSD 정의와 임계값 1 은 Allen, Shin & Cooper(1978) TRR 667:67-74 이며,
      Dabkowski et al.(2025) p.597 이 이를 인용·정의하고 있다(근거등급 A).
      분모를 전 통과 차량으로 확장한 선례는 Gaca & Kiec(2015) TRR 2514(1),
      Varhelyi(1998) AAP 30(6) TZ 지표, InDeV(2016) SSM 3군 분류(교통
      파라미터 계열)다(근거등급 B). 본 과제의 신규성은 집계 단위 확장뿐이다.
    limitation_note: >
      PSD 의 원 용도는 상충 사건 발생 시의 심각도 판정이다. 사건이 없는
      통과 차량에 적용한 문헌은 확인되지 않았다. 이것이 본 과제의 기여이자
      방어 대상임을 리포트에 명시한다.

  # --- 인지가능지점 P_v ---------------------------------------------------
  pv_mode:
    default: "G"                 # 오늘 산출하는 기본값
    options:
      G:
        name: "기하 기준"
        definition: "P_v = D30 (상류 30 m 고정)"
        requires: "드론 영상만"
        interpretation: >
          시거 장애가 없다고 가정하므로 위험의 하한(lower bound).
          3지점에 동일 규칙을 적용하므로 서열 비교에는 그대로 유효.
      S:
        name: "시거 반영"
        definition: "P_v = min(시거 제약 지점, D30)"
        requires: "지상 보조사진 4방향 + 장애물 실측"
        status: "REQUIRES_FIELD_SURVEY"

  # --- 제동 가정 (조우 판정의 encounter 블록과 값이 다르다. 혼동 금지) ----
  t_r:
    value: 1.0
    unit: s
    evidence: C
    source: >
      보행자를 이미 인지한 각성 상태 운전자의 현실적 반응시간.
      AASHTO 설계값 2.5 s 를 쓰면 대부분의 차량이 '정지 불가'로 나와
      지점 간 판별력이 사라진다. 조우 판정(encounter.perception_reaction_s
      = 2.5 s)과 목적이 다르므로 값이 다른 것이 정상이다.
    sensitivity: [1.0, 1.5]
  a_d:
    value: 3.4
    unit: m/s^2
    evidence: B
    source: "AASHTO 쾌적 감속도. 5.0 은 강한 제동 조건"
    sensitivity: [3.4, 5.0]

  variants:                      # V-E6 — 4조합 전부 산출 필수
    - {id: base,       t_r: 1.0, a_d: 3.4}
    - {id: tr15,       t_r: 1.5, a_d: 3.4}
    - {id: hard_brake, t_r: 1.0, a_d: 5.0}
    - {id: tr15_hard,  t_r: 1.5, a_d: 5.0}
  require_rank_stable_across_variants: true
  note_on_variants: >
    절대값은 가정에 좌우되나 동일 가정을 3지점에 공통 적용하므로 서열은
    대체로 강건하다. 4조합 전부에서 서열이 유지되는지 확인해 보고한다.
    서열이 조합에 따라 뒤집히면 그 사실 자체를 결과로 보고한다.
    좋아 보이는 조합을 골라 쓰지 않는다.

  # --- 분모 정의 ----------------------------------------------------------
  denominator:
    basis: all_passing_vehicles
    require_pedestrian_present: false      # ★ 절대 true 로 바꾸지 말 것
    exclude_turning: true
    exclude_parking_maneuver: true
    min_track_s: 1.0
    exclude_dependent: false               # 기본은 포함. 제외 버전 병행 산출
    run_both_dependent_modes: true
    note: >
      보행자 유무를 묻지 않는 것이 이 지표의 존재 이유다.
      조우 필터를 넣는 순간 SSM 사각지대 대응이라는 목적이 사라진다.

  # --- 판정 임계 ----------------------------------------------------------
  ser_threshold: 1.0             # SER > 1 이면 정지 불가 (PSD < 1 과 동치)
  ci_method: wilson
  ci_level: 0.95

  outputs: [CEI_rate_pct, SER_50, SER_85, v_safe_kmh,
            V85_approach_kmh, CEI_mean, excess_kmh]

  # --- 참조표 (t_r=1.0, a_d=3.4) — 코드 검산용 --------------------------
  reference_v_safe_kmh:
    10: 19.9
    15: 26.1
    20: 31.5
    25: 36.3
    30: 40.6
    40: 48.4
    50: 55.3
    60: 61.5

# ===========================================================================
# 6. 부트스트랩 서열 안정성  ★ v0.2 신설
# ===========================================================================
ranking:
  enabled: true
  n_bootstrap: 10000
  seed: 20260810                 # 고정. 실행마다 달라지면 provenance 무의미
  resample_unit: vehicle         # 지점별 독립 복원추출
  metrics: [CEI_rate_pct, SER_85, IP_risky_share]
  cross_metric_check: true       # 3개 지표의 서열이 일치하는지 확인
  report_format: "order_probability"
  note: >
    점추정 비교를 금지한다. "A>B>C 일 확률 68%" 형식으로만 보고한다.
    이것이 30분 데이터로 낼 수 있는 정직한 최대치다.

# ===========================================================================
# 7. DPD 계수 (Tier 0 — 폴란드 계수, 참조용)   v0.1 에서 변경 없음
# ===========================================================================
dpd_coefficients:
  calibration_id: "PL_Dabkowski2025"
  evidence: B
  note: >
    폴란드 응답자(전문가 약 10%, 나머지 학생) 130~136명의 인지위험 평정을
    회귀한 계수. 인지위험이지 상해위험이 아니다. 절대값의 안전등급 해석과
    폴란드 지점(Warsaw 6.05% / Wroclaw 3.99%)과의 직접 비교는 금지.
    산출물 명칭은 반드시 "P-PDI (폴란드 계수 기준 참조값)".
  A1: {b1: 1.196, b2: -0.075, b0: -0.923, source: "원문 식(2)"}
  B1: {b1: 0.862, b2: -0.052, b0: 0.0,    source: "원문 식(3), 절편 없음"}
  B2:
    b2: 0.561
    b0: 2.713
    source: >
      원문 식(4)는 계수 2개가 전치되어 있다(원문 표기 b2=2.713, b0=0.561).
      근거 4건은 claude/03_PDI_DPD_검증_및_한국형PoC_v01.md §2.3.
      본 프로젝트는 수정식을 채택한다. 변곡점 a5 = -4.84 m/s^2.
  units: {S_m: m, V_m: m/s, a5: m/s^2}

# ===========================================================================
# 8. 조우(E-1) 판정   ★ CEI 의 t_r 과 값이 다르다. 반드시 이 블록을 쓸 것
# ===========================================================================
encounter:
  perception_reaction_s:
    value: 2.5
    unit: s
    evidence: A
    source: >
      AASHTO 정지시거 설계값. 물리적으로 정지 불가능했던 차량을 미양보로
      잘못 계수하지 않기 위한 보수적(관대한) 기준.
      CEI 의 cei.t_r(=1.0)과 목적이 달라 값이 다르다. 같은 함수를 쓰되
      파라미터 블록을 반드시 구분해서 읽는다.
    sensitivity: [1.5, 2.5]
  deceleration_ms2: {value: 3.4, unit: m/s^2, evidence: A, source: "AASHTO"}
  intent_speed_ms: {value: 0.2, unit: m/s, evidence: C}
  intent_duration_s:
    value: 3.0
    unit: s
    evidence: C
    note: "연직 시점에서는 의사 판별이 어렵다. 오분류율을 Stage 2 에서 보고"

# ===========================================================================
# 8A. 조우(E-1) 모호 등급   ★ 신설 — 06번 지시문 §3.3 반영 (2026-08-13)
# ===========================================================================
encounter_ambiguity:            # 신규 — 2026-08-13 지시문 반영
  enabled: true
  confirmed_rule: "WZ 정지 → CW 진입(실제 횡단)으로 이어짐"
  ambiguous_rule: >
    WZ 내 속도 ≈ 0 (v_stop 이하)로 min_dwell_s 이상 체류했으나
    이후 CW 진입 없이 WZ 이탈
  excluded_rule: >
    WZ 통과 시 연석과 평행한 이동 벡터(heading이 연석 방향과
    threshold_deg 이내), 정지 없음
  min_dwell_s: {value: 2.0, unit: s, evidence: C, note: "잠정값. 민감도 분석 대상"}
  threshold_deg: {value: 30.0, evidence: C}
  note: "Stage 2 육안 검토에서 confirmed/ambiguous 자동판정 대 사람판정 오분류율을 반드시 함께 보고"

# ===========================================================================
# 9. 준수도 판정   v0.1 에서 변경 없음
# ===========================================================================
compliance:
  v_stop_ms:
    value: 0.3
    unit: m/s
    evidence: C
    sensitivity: [0.2, 0.3, 0.5]     # V-E4
    source: >
      문헌 표준값 없음. 궤적 지터로 인한 겉보기 속도 수준에 근거한 잠정값.
      이 값 하나로 준수율 결론이 뒤집힐 수 있으므로 단일값 확정 보고 금지.
  tau_stop_s:
    value: 0.5
    unit: s
    evidence: C
    note: >
      도로교통법상 '일시정지'는 완전 정지 사실만 요구하며 지속시간을
      요구하지 않는다. 이 값은 계측 신뢰성용이며 법적 기준이 아니다.
      리포트에 그렇게 표기할 것.
  v_yield_max_ms: {value: 2.0, unit: m/s, evidence: C}

# ===========================================================================
# 10. 억제 패널  ★ v0.2 에서 primary 로 승격
# ===========================================================================
suppression_panel:
  enabled: true
  primary_indicator: true
  indicators:
    SP-1: {name: "대기시간 평균·85%ile", unit: s,     computable_30min: true}
    SP-2: {name: "gap 거부 횟수/인",     unit: count, computable_30min: true}
    SP-3: {name: "횡단 포기율",          unit: pct,   computable_30min: conditional}
    SP-4: {name: "뛰어서 횡단한 비율",   unit: pct,   computable_30min: true}
    SP-5: {name: "횡단보도 이탈 횡단율", unit: pct,   computable_30min: true}
    SP-6: {name: "E-2x 기인 상충 비중",  unit: pct,   computable_30min: conditional}
    SP-7: {name: "횡단량/잠재수요 비",   unit: ratio, computable_30min: false}
  run_speed_ms:
    value: 2.5
    unit: m/s
    evidence: C
    source: "SP-4 '뛰어서 횡단' 판정 임계. 보행속도 상한 근사"
  decision_rule: >
    CEI 등 위험지표가 낮은데 SP-1·SP-2·SP-3 가 상위이면 '안전'이 아니라
    [보행 억제]. SP-5·SP-6 가 상위이면 [시설 회피].
    3개 지점뿐이라 지점 간 백분위가 불안정하므로, 자동 판정은
    PENDING_VERIFICATION 으로 두고 구성요소 값을 표로 낸다.

# ===========================================================================
# 11. 보조 SSM 지표   v0.1 에서 변경 없음 (부록 배치)
#
# 주의(2026-08-13): pet_conflict_s/pet_severe_s 는 PET 한 지표의 2단계 임계
# (상충/심각)다. 반면 rttc_conflict_s/ttc_severe_s 는 서로 다른 두 지표 —
# S-2 RTTC_min, S-3 TTC_min — 의 각각 유일한 임계이며, 한 지표의 두 단계가
# 아니다. 근거: 지표정의서 v0.3 §5.2. 키 이름은 혼동 소지가 있으나 값은
# 각 지표 정의와 정확히 대응하므로 변경하지 않는다.
# ===========================================================================
ssm_auxiliary:
  enabled: true
  report_section: appendix
  pet_conflict_s: {value: 3.0, unit: s, evidence: A, source: "Chen et al.(2017), Sayed & Zein / Ni et al. 근거"}
  pet_severe_s:   {value: 1.5, unit: s, evidence: B, source: "Tageldin & Sayed(2016). 환경 의존적, 양쪽 다 산출해 분포 확인"}
  rttc_conflict_s: {value: 3.0, unit: s, evidence: A}
  ttc_severe_s:   {value: 1.5, unit: s, evidence: B}
  drac_threshold: {value: null, evidence: C, note: "임계 미확정. 분포만 보고"}

# ===========================================================================
# 12. 검증 게이트   ★ v0.2: 지표군별 분리
# ===========================================================================
validation:
  gate_requirements:            # ★ 신설 — 지표군별로 필요한 게이트만 요구
    cei:          [V-A, V-A2, V-D]
    compliance:   [V-A, V-A2, V-D]
    exposure:     [V-A, V-A2, V-B2]
    interaction:  [V-A, V-A2, V-D, V-B, V-B2]
    pedestrian:   [V-A, V-A2, V-B, V-B2]
    note: >
      CEI 는 보행자 궤적을 쓰지 않으므로 V-B / V-B2 / T-1 을 기다리지 않는다.
      미통과 지표군만 GATE_FAILED 로 막고 통과 지표군은 산출한다.
      어떤 게이트가 어떤 지표를 막았는지 validation_report.md 에 명시한다.

  stage1_gate:
    scale_error_tol: 0.03                    # V-A
    registration_residual_tol_m: 0.05        # V-A2
    speed_error_tol_kmh:                     # V-D  ★ CEI 게이트로 승격
      value: 1.0
      evidence: A
      source: "원 논문 레이저 실측 대비 1 km/h 이내 실적. SER 의 분자를 지배"
    position_rmse_tol_m:                     # V-B (CW 구역 내)
      value: 0.10
      evidence: A
      source: "원 논문 차량 궤적 평균 위치오차 10 cm 미만. v0.2 의 0.3 m 기준으로는 DPD 가 0.15 이상 흔들려 지표가 성립하지 않는다."
    recall_min: 0.95                         # V-B2
    fp_rate_max: 0.05
    sample_frames: 100
    match_iou: 0.30
  stage1_warning:
    frag_ratio_max: 0.30
    gap_ratio_max: 0.10
    class_flicker_rate_max: 0.05
    id_switch_per_track_max: 0.1
    overlap_dup_rate_max: 0.05
  stage2:
    type_agreement_min: 0.90                 # V-F
    interaction_recall_min: 0.90             # V-G
    sm_error_tol_m: 0.15                     # V-C
    vm_error_tol_kmh: 1.0
    pet_error_tol_s: 0.2
    sample_for_vc: 20
    include_turning: false

# ===========================================================================
# 13. 표본 수 판정   ★ v0.2: cei 종류 추가
# ===========================================================================
sampling:
  ratio_insufficient_below: 30
  ratio_trend_only_below: 100
  ci_level: 0.95
  cei:                                       # ★ 신설
    insufficient_below: 30                   # 통과 차량 수 기준
    trend_only_below: 100
    note: >
      CEI_rate 60% vs 30% 검출에 지점당 42대, 60% vs 40% 에 97대 필요
      (alpha 0.05 양측, 검정력 80%). 30분이면 대체로 충족된다.
  pdi_min_survey_days:
    value: 4
    evidence: A
    source: >
      원 논문 민감도 분석. 저자 권고 최소 4일.
      30분 단일 세션은 항상 REQUIRES_LONGER_OBS. Warsaw 3일, Wroclaw 4일부터
      상대표준오차 5% 미만.
  encounter_required_for_ranking:            # ★ 신설 — 이번 개정의 출발점
    value: 93
    evidence: A
    source: >
      50% vs 30% 비율 차이 검출에 필요한 지점당 표본
      (alpha 0.05 양측, 검정력 80%). 확보 불가로 확인됨(2026-08-10).
      이것이 주지표를 CEI 로 전환한 근거다.
  b2_invalid_warn_ratio: 0.05

# ===========================================================================
# 14. 보고 규약   ★ v0.2: final_output_set 교체
# ===========================================================================
reporting:
  pdi_label: "P-PDI (폴란드 계수 기준 참조값)"
  cei_label:   "PSD<1 통과율 (CEI) [%]"                       # 병기 규약
  cei_label_G: "PSD<1 통과율 (CEI-G) [%] — 기하 기준, 시거 장애 미반영 하한값"
  cei_label_S: "PSD<1 통과율 (CEI-S) [%] — 시거 반영"
  ser_label:    "속도초과비 SER"
  v_safe_label: "안전 최대 접근속도 v_safe [km/h]"
  dual_naming_required: true      # 최소 1회는 PSD 를 병기. CEI 단독 표기 금지
  forbid_single_composite_score: true
  forbid_point_estimate_ranking: true        # ★ 신설. 서열은 확률로만
  final_output_set:                          # ★ 교체
    - ranking_stability          # [1] 서열 확률표
    - CEI_rate_pct               # [2] 지표값 + CI
    - SER_85
    - v_safe_kmh
    - V85_approach_kmh
    - excess_kmh
    - cei_variant_rank_stability # [3] 민감도 4조합 서열 유지 여부
    - countermeasure_matrix      # [4] CEI × 정지율 2×2
    - suppression_panel          # [5] 억제 패널
    - L1_noncompliance           # [6] 적법성 결격
  reference_only_outputs:        # 값 해석 금지. 분포만
    - P_PDI_pct
    - interaction_profile
    - dpd_distribution
    - JDI_pct
  pdi_mandatory_companions: [NI, type_composition, mean_dpd_by_type, safe_interaction_ratio]
  status_codes:
    - INSUFFICIENT_SAMPLE
    - GATE_FAILED
    - NOT_OBSERVABLE
    - REQUIRES_FIELD_SURVEY
    - REQUIRES_LONGER_OBS
    - PENDING_VERIFICATION
  null_not_zero: true
  fixed_disclaimers:
    - "본 분석은 절대 안전등급이 아니라 3개 지점 간 상대 서열을 판정한 것이다."
    - "본 지표는 Allen et al.(1978)의 PSD(정지거리비, 임계 1)를 전 통과 차량으로 확장 적용한 것이며, 'CEI(반사실적 노출 지수)'는 본 과제에서 부여한 명칭으로 기존 문헌의 지표명이 아니다."
    - "PSD 의 원 용도는 상충 사건 발생 시의 심각도 판정이다. 사건이 없는 통과 차량에 적용한 것은 본 과제의 확장이다."
    - "서열은 점추정이 아니라 부트스트랩 확률로 제시되었다."
    - "CEI 는 물리적 정지 가능성을 평가한 것으로, 운전자의 실제 정지 의도와 다르다. 반드시 정지율과 교차표로 함께 읽는다."
    - "CEI-G 는 시거 장애를 반영하지 않은 하한값이다. 실제 위험은 이보다 크다."
    - "위험지표가 낮은 지점이라도 억제 패널이 상위이면 안전하다고 해석할 수 없다."
    - "DPD 는 설문 기반 인지위험 값이며 상해위험이 아니다. DPD 0.5 는 사망확률 50% 가 아니다."
    - "본 관측은 30분 단일 세션이므로 P-PDI 절대값은 판단 불가이며 절차 검증과 상대 비교에만 사용한다."
    - "연직 시점 촬영으로 보행자 주시·스마트폰 사용(P-9·P-10)은 산출 불가하다."
    - "회전 차량은 CEI·PDI 적용 대상이 아니다."

